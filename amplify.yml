version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - |
          printf "SUPABASE_SERVICE_ROLE_KEY=%s\n" "$SUPABASE_SERVICE_ROLE_KEY" > .env.production
          printf "CLOUDINARY_API_SECRET=%s\n"     "$CLOUDINARY_API_SECRET"     >> .env.production
          printf "CLOUDINARY_API_KEY=%s\n"        "$CLOUDINARY_API_KEY"        >> .env.production
          printf "CLOUDINARY_CLOUD_NAME=%s\n"     "$CLOUDINARY_CLOUD_NAME"     >> .env.production
          printf "ADMIN_VERIFY_PIN=%s\n"          "$ADMIN_VERIFY_PIN"          >> .env.production
          printf "RAILWAY_API_URL=%s\n"           "$RAILWAY_API_URL"           >> .env.production
  artifacts:
    baseDirectory: .
    files:
      - .next/**/*
      - .env.production
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
